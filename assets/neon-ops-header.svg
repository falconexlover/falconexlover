<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">FalconExLover — NEON OPS // SYSTEMS ONLINE</title>
  <desc id="hero-desc">Cyberpunk profile banner for FalconExLover, a systems, automation, and full-stack engineer.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.55" stop-color="#09121C"/>
      <stop offset="1" stop-color="#10061A"/>
    </linearGradient>
    <linearGradient id="hero-neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E7FF"/>
      <stop offset="0.58" stop-color="#7CFF00"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <pattern id="hero-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00E7FF" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="hero-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hero-clip"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#hero-clip)">
    <rect width="1200" height="360" fill="url(#hero-bg)"/>
    <rect width="1200" height="360" fill="url(#hero-grid)"/>
    <path d="M0 302H154l34-34h210l26 26h354l42-42h380" fill="none" stroke="#00E7FF" stroke-opacity="0.28" stroke-width="2"/>
    <path d="M726 0l-94 94v156l110 110h458V0z" fill="#FF2BD6" fill-opacity="0.035" stroke="#FF2BD6" stroke-opacity="0.15"/>
    <circle cx="1040" cy="177" r="112" fill="none" stroke="#00E7FF" stroke-opacity="0.1" stroke-width="30"/>
    <circle cx="1040" cy="177" r="79" fill="none" stroke="#7CFF00" stroke-opacity="0.13" stroke-width="2" stroke-dasharray="5 12"/>

    <g transform="translate(58 48)">
      <path d="M0 0h34" stroke="#00E7FF" stroke-width="3"/>
      <path d="M0 0v34" stroke="#00E7FF" stroke-width="3"/>
      <text x="0" y="56" fill="#7CFF00" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="3">// NEON OPS • ONLINE</text>
      <text x="0" y="142" fill="#F5FBFF" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">FALCON</text>
      <text x="250" y="142" fill="url(#hero-neon)" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-2" filter="url(#hero-glow)">EXLOVER</text>
      <rect x="1" y="163" width="604" height="3" rx="1.5" fill="url(#hero-neon)"/>
      <text x="0" y="205" fill="#A9BDCB" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="2">SYSTEMS / AUTOMATION / FULL-STACK</text>
      <g transform="translate(0 238)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.4">
        <rect width="150" height="34" rx="5" fill="#00E7FF" fill-opacity="0.08" stroke="#00E7FF" stroke-opacity="0.65"/>
        <text x="18" y="22" fill="#00E7FF">BUILD SYSTEMS</text>
        <rect x="162" width="160" height="34" rx="5" fill="#7CFF00" fill-opacity="0.07" stroke="#7CFF00" stroke-opacity="0.6"/>
        <text x="180" y="22" fill="#7CFF00">SHIP PRODUCTS</text>
        <rect x="334" width="154" height="34" rx="5" fill="#FF2BD6" fill-opacity="0.07" stroke="#FF2BD6" stroke-opacity="0.6"/>
        <text x="352" y="22" fill="#FF2BD6">CLOSE LOOPS</text>
      </g>
    </g>

    <g transform="translate(900 98)">
      <path d="M120 0l84 48v96l-84 48-84-48V48z" fill="#05070D" fill-opacity="0.8" stroke="#00E7FF" stroke-width="2" filter="url(#hero-glow)"/>
      <path d="M120 26l59 34v68l-59 34-59-34V60z" fill="none" stroke="#FF2BD6" stroke-opacity="0.7" stroke-width="2"/>
      <path d="M91 119l20-58 17 37 42-13-50 58z" fill="none" stroke="#7CFF00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="120" cy="96" r="5" fill="#F5FBFF"/>
      <text x="120" y="224" text-anchor="middle" fill="#A9BDCB" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="4">OPERATOR // 01</text>
    </g>

    <path d="M0 358h1200" stroke="url(#hero-neon)" stroke-width="4"/>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#00E7FF" stroke-opacity="0.35" stroke-width="2"/>
</svg>
